[build]
builder = "NIXPACKS"
# Install ALL deps (incl. typescript/@types) then generate + compile.
# Nixpacks production install omits devDependencies — types must live in dependencies.
buildCommand = "sh -c 'export DATABASE_URL=\"${DATABASE_URL:-postgresql://build:build@127.0.0.1:5432/build}\" && npm install && npx prisma generate && npx tsc'"

[deploy]
startCommand = "npm start"
healthcheckPath = "/api/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
