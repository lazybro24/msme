[build]
builder = "NIXPACKS"
# Nixpacks already runs `npm ci` in install — do NOT run it again (EBUSY on node_modules).
buildCommand = "sh -c 'export DATABASE_URL=\"${DATABASE_URL:-postgresql://build:build@127.0.0.1:5432/build}\" && npx prisma generate && npx tsc'"

[deploy]
startCommand = "node scripts/start-prod.js"
healthcheckPath = "/api/health"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
