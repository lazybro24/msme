[build]
builder = "NIXPACKS"
# Install ALL deps (incl. typescript/@types) then generate + compile.
buildCommand = "sh -c 'export DATABASE_URL=\"${DATABASE_URL:-postgresql://build:build@127.0.0.1:5432/build}\" && npm ci && npx prisma generate && npx tsc'"

[deploy]
startCommand = "node scripts/start-prod.js"
healthcheckPath = "/api/health"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
